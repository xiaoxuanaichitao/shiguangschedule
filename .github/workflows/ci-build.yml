name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  prepare-resources:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 生成贡献者数据 (Contributors)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq webp
          chmod +x .github/scripts/build_contributors.sh
          .github/scripts/build_contributors.sh || true
          mkdir -p shared/src/commonMain/composeResources/files/contributors_data
          if [ ! -f shared/src/commonMain/composeResources/files/contributors_data/contributors.json ]; then
            echo '{"app_dev":[],"jiaowu_adapter":[]}' > shared/src/commonMain/composeResources/files/contributors_data/contributors.json
          fi

      - name: 打包共享资源 (tar)
        run: |
          tar -czf shared-assets.tar.gz \
            shared/src/commonMain/composeResources/files/contributors_data

      - name: 上传资源 artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: shared-assets.tar.gz
          retention-days: 1

  unit-tests:
    needs: prepare-resources
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 运行共享模块单元测试
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest :shared:testAndroidHostTest --no-configuration-cache --stacktrace

  build-android:
    needs: [prepare-resources, unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 Android APK (Debug & Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "检测到私有 Release 签名 Secret，使用正式签名构建 Release APK"
            echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.jks
            SIGNING_STORE_FILE="${{ github.workspace }}/androidApp/release.jks" \
            SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            SIGNING_KEY_ALIAS="$KEY_ALIAS" \
            SIGNING_KEY_PASSWORD="$KEY_PASSWORD" \
            ./gradlew assembleRelease --stacktrace
          else
            echo "使用仓库固定签名 androidApp/ci-debug.keystore 构建 APK（支持后续覆盖升级）"
            ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: 上传 Debug APK（若存在）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: 准备自动更新 Release 资产与清单
        id: prepare_release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          VERSION_CODE=$((37 + GITHUB_RUN_NUMBER))
          VERSION_NAME="2.1.0"
          TAG_NAME="v${VERSION_NAME}-b${VERSION_CODE}"
          APK_SRC=$(ls androidApp/build/outputs/apk/release/*.apk | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "未找到 Release APK，跳过自动发布"
            exit 0
          fi
          mkdir -p release_out
          APK_NAME="ShiguangSchedule-CUMT-${TAG_NAME}.apk"
          cp "$APK_SRC" "release_out/${APK_NAME}"
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 6)
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/${APK_NAME}"
          PAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg tagName "$TAG_NAME" \
            --arg changelog "$COMMIT_MSG" \
            --arg apkUrl "$APK_URL" \
            --arg fallbackPageUrl "$PAGE_URL" \
            '{versionCode: $versionCode, versionName: $versionName, tagName: $tagName, changelog: $changelog, apkUrl: $apkUrl, fallbackPageUrl: $fallbackPageUrl}' \
            > release_out/update-manifest.json
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_file=release_out/${APK_NAME}" >> "$GITHUB_OUTPUT"
          {
            echo "changelog<<EOF"
            echo "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 自动发布最新 GitHub Release（供 App 内自动更新）
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && steps.prepare_release.outputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.prepare_release.outputs.tag_name }}
          name: "矿大时光课表 ${{ steps.prepare_release.outputs.tag_name }}"
          body: ${{ steps.prepare_release.outputs.changelog }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            ${{ steps.prepare_release.outputs.apk_file }}
            release_out/update-manifest.json

  build-desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-resources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: desktop-linux
            output_glob: |
              desktopApp/build/compose/binaries/main-release/deb/*.deb
              desktopApp/build/compose/binaries/main-release/rpm/*.rpm
          - os: windows-latest
            artifact_name: desktop-windows
            output_glob: |
              desktopApp/build/compose/binaries/main-release/exe/*.exe
              desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: macos-latest
            artifact_name: desktop-macos
            output_glob: |
              desktopApp/build/compose/binaries/main-release/dmg/*.dmg
              desktopApp/build/compose/binaries/main-release/pkg/*.pkg

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        shell: bash
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建桌面安装包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./gradlew.bat renameDesktopPackage --no-configuration-cache --stacktrace
          else
            chmod +x ./gradlew
            ./gradlew renameDesktopPackage --no-configuration-cache --stacktrace
          fi

      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_glob }}
          if-no-files-found: error
          retention-days: 7
