name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  prepare-resources:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 生成贡献者数据 (Contributors)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq webp
          chmod +x .github/scripts/build_contributors.sh
          .github/scripts/build_contributors.sh || true
          mkdir -p shared/src/commonMain/composeResources/files/contributors_data
          if [ ! -f shared/src/commonMain/composeResources/files/contributors_data/contributors.json ]; then
            echo '{"app_dev":[],"jiaowu_adapter":[]}' > shared/src/commonMain/composeResources/files/contributors_data/contributors.json
          fi

      - name: 打包共享资源 (tar)
        run: |
          tar -czf shared-assets.tar.gz \
            shared/src/commonMain/composeResources/files/contributors_data

      - name: 上传资源 artifact
        uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: shared-assets.tar.gz
          retention-days: 1

  unit-tests:
    needs: prepare-resources
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 运行共享模块单元测试
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest :shared:testAndroidHostTest --no-configuration-cache --stacktrace

  build-android:
    needs: [prepare-resources, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 Android APK (Debug & Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "检测到私有 Release 签名 Secret，使用正式签名构建 Release APK"
            echo "$KEYSTORE_BASE64" | base64 --decode > androidApp/release.jks
            SIGNING_STORE_FILE="${{ github.workspace }}/androidApp/release.jks" \
            SIGNING_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            SIGNING_KEY_ALIAS="$KEY_ALIAS" \
            SIGNING_KEY_PASSWORD="$KEY_PASSWORD" \
            ./gradlew assembleRelease --stacktrace
          else
            echo "使用仓库固定签名 androidApp/ci-debug.keystore 构建 APK（支持后续覆盖升级）"
            ./gradlew assembleDebug assembleRelease --stacktrace
          fi

      - name: 上传 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: 上传 Debug APK（若存在）
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  build-desktop:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare-resources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: desktop-linux
            output_glob: |
              desktopApp/build/compose/binaries/main-release/deb/*.deb
              desktopApp/build/compose/binaries/main-release/rpm/*.rpm
          - os: windows-latest
            artifact_name: desktop-windows
            output_glob: |
              desktopApp/build/compose/binaries/main-release/exe/*.exe
              desktopApp/build/compose/binaries/main-release/msi/*.msi
          - os: macos-latest
            artifact_name: desktop-macos
            output_glob: |
              desktopApp/build/compose/binaries/main-release/dmg/*.dmg
              desktopApp/build/compose/binaries/main-release/pkg/*.pkg

    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 下载共享资源
        uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: .

      - name: 解压共享资源
        shell: bash
        run: |
          tar -xzf shared-assets.tar.gz
          rm -f shared-assets.tar.gz

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', '**/*.gradle.kts', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建桌面安装包
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./gradlew.bat renameDesktopPackage --no-configuration-cache --stacktrace
          else
            chmod +x ./gradlew
            ./gradlew renameDesktopPackage --no-configuration-cache --stacktrace
          fi

      - name: 上传桌面产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.output_glob }}
          if-no-files-found: error
          retention-days: 7
