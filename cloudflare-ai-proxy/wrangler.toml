name = "shiguang-free-ai-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# ===== 方案 1（默认推荐）：智谱开放平台 BigModel（永久免费 + 国内直连 + 支持识图）=====
UPSTREAM_BASE_URL = "https://open.bigmodel.cn/api/paas/v4"
TEXT_MODEL = "glm-4-flash-250414"
VISION_MODEL = "glm-4.6v-flash"
VISION_SUPPORTS_TOOLS = "false"

# ===== 方案 2（备选）：魔搭社区 ModelScope（每天数千次免费额度，Qwen2.5-VL 识图极强）=====
# UPSTREAM_BASE_URL = "https://api-inference.modelscope.cn/v1"
# TEXT_MODEL = "Qwen/Qwen2.5-72B-Instruct"
# VISION_MODEL = "Qwen/Qwen2.5-VL-72B-Instruct"
# VISION_SUPPORTS_TOOLS = "false"

# 单设备每日免费请求上限（北京时间 0 点自动重置）
DAILY_LIMIT = "20"
MAX_TOKENS = "2048"

# 轻校验客户端标识（与 App 内 CumtConstants.FREE_AI_CLIENT_HEADER 一致，留空则不校验）
APP_CLIENT_TOKEN = "cumt-shiguang-app"

# ===== 机密变量（请勿写在本文件！在 Cloudflare Dashboard 或命令行设置 Secret）=====
# npx wrangler secret put UPSTREAM_API_KEY
# 支持填入多把 Key 用英文逗号分隔自动负载均衡

# ===== 可选：持久化限流 KV（不绑定也可直接运行，自动退化为内存限流）=====
# [[kv_namespaces]]
# binding = "QUOTA_KV"
# id = "填入你的_KV_Namespace_ID"
